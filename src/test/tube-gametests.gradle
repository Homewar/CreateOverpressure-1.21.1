// Run with: gradlew -I src/test/tube-gametests.gradle runGameTestServer
// The test fixtures are added only to this dedicated test run, never to a normal JAR.
if (!gradle.startParameter.taskNames.any { it.endsWith('runGameTestServer') }) {
    throw new GradleException('This init script is only for runGameTestServer')
}
gradle.afterProject { project ->
    if (project == project.rootProject) {
        project.sourceSets.main.java.srcDir('src/test/java')
        project.sourceSets.main.resources.srcDir('src/test/resources')
        project.neoForge.runs.gameTestServer.gameDirectory = project.file('build/tube-gametest-world')
    }
}
